name: Portfolio Playwright

on:
  push:
    paths:
      - 'portfolio-playwright/**'
      - '.github/workflows/portfolio-playwright.yml'
  pull_request:
  workflow_dispatch:
  # Once a week (Monday 06:17 UTC) — production smoke against piotrdolinski.com
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: Mobile Chrome
            browser: chromium
          - project: Mobile Safari
            browser: webkit

    defaults:
      run:
        working-directory: portfolio-playwright

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portfolio-playwright/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps "${{ matrix.browser }}"

      - name: Type-check public suite
        run: npm run typecheck

      - name: Run ${{ matrix.project }} tests
        env:
          BASE_URL: https://piotrdolinski.com
          CI: 'true'
        run: npx playwright test --project="${{ matrix.project }}" --workers=1

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-playwright-${{ matrix.browser }}-${{ strategy.job-index }}
          path: |
            portfolio-playwright/playwright-report/
            portfolio-playwright/test-results/
          if-no-files-found: ignore
          retention-days: 14
